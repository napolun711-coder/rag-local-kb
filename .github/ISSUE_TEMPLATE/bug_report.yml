name: Bug report
description: Report a reproducible defect without private data or credentials.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, `.env` contents, databases, uploads, logs with
        private data, or security exploit details. Report vulnerabilities
        privately using the process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, repeatable steps using synthetic data.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python version, Ollama/model, browser, relevant non-secret settings.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
      description: Tests, doctor, logs, or screenshots with private data removed.
    validations:
      required: false
