[project]
name = "local-rag-kb"
version = "0.1.0"
description = "A modular monolith for a local retrieval-augmented knowledge base."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["rag", "lightrag", "local-first", "knowledge-base", "fastapi"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.0,<7.0",
    "python-docx>=1.2,<2.0",
    "openpyxl>=3.1,<4.0",
    "requests>=2.32,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
